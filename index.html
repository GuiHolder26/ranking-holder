<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking de Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1416; --panel:#161F22; --panel-2:#1D2729; --line:#2A3538;
    --gold:#E3B341; --gold-dim:#6B5726; --teal:#33C6B0; --teal-dim:#1B4A44;
    --silver:#B9C2C4; --bronze:#C97A4A; --text:#F2F0EA; --text-dim:#8B9598; --danger:#D9654F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  .display{width:100%;height:100vh;position:relative;}
  .slide{ position:absolute; inset:0; display:flex; flex-direction:column; padding:48px 64px 40px; opacity:0; pointer-events:none; transition:opacity 0.9s ease; }
  .slide.active{opacity:1; pointer-events:auto;}
  .eyebrow{ font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; letter-spacing:0.14em; text-transform:uppercase; color:var(--teal); margin-bottom:2px; }
  h1.slide-title{ font-family:'Oswald',sans-serif; font-weight:700; font-size:52px; letter-spacing:0.01em; margin:0 0 4px; color:var(--text); }
  .slide-sub{ font-size:17px; color:var(--text-dim); margin-bottom:28px; }

  .podium-wrap{ flex:1; display:flex; align-items:flex-end; justify-content:center; gap:28px; padding-bottom:8px; }
  .podium-slot{ display:flex; flex-direction:column; align-items:center; width:220px; }
  .podium-photo-wrap{ position:relative; margin-bottom:14px; }
  .podium-photo{ border-radius:50%; object-fit:cover; display:block; border:4px solid var(--line); }
  .rank-badge{ position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#12181A; border:3px solid var(--bg); }
  .podium-name{ font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; margin-top:2px; text-align:center; }
  .podium-count{ font-family:'Oswald',sans-serif; font-size:40px; font-weight:700; }
  .podium-vgv{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text-dim); margin-top:2px; }
  .podium-bar{ width:100%; border-radius:10px 10px 0 0; margin-top:14px; }
  .p1 .podium-photo{ width:132px; height:132px; border-color:var(--gold); }
  .p2 .podium-photo{ width:104px; height:104px; border-color:var(--silver); }
  .p3 .podium-photo{ width:104px; height:104px; border-color:var(--bronze); }
  .p1 .rank-badge{ background:var(--gold); } .p2 .rank-badge{ background:var(--silver); } .p3 .rank-badge{ background:var(--bronze); }
  .p1 .podium-bar{ height:150px; background:linear-gradient(180deg,var(--gold-dim),var(--panel-2)); }
  .p2 .podium-bar{ height:105px; background:var(--panel-2); }
  .p3 .podium-bar{ height:70px; background:var(--panel-2); }
  .p1 .podium-count{ color:var(--gold); }

  .rest-list{ margin-top:18px; display:flex; flex-direction:column; gap:6px; max-width:820px; align-self:center; width:100%; overflow-y:auto; }
  .rest-row{ display:flex; align-items:center; gap:16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 20px; }
  .rest-rank{ font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; color:var(--text-dim); width:24px; }
  .rest-name{ font-family:'Inter',sans-serif; font-weight:600; font-size:15.5px; flex:1; }
  .rest-count{ font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; color:var(--teal); }
  .rest-vgv{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim); width:120px; text-align:right; }

  .meta-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px; }
  .meta-badge{ font-family:'Oswald',sans-serif; font-weight:600; font-size:18px; background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:8px 20px; color:var(--teal); }
  .broker-rows{ flex:1; display:flex; flex-direction:column; gap:9px; justify-content:center; overflow-y:auto; }
  .broker-row{ display:flex; align-items:center; gap:18px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 22px; }
  .broker-photo{ width:52px; height:52px; border-radius:50%; object-fit:cover; border:2px solid var(--line); flex-shrink:0; }
  .broker-avatar-fallback{ width:52px; height:52px; border-radius:50%; flex-shrink:0; background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; color:var(--text-dim); }
  .broker-name{ font-weight:600; font-size:17px; width:150px; }
  .progress-track{ flex:1; height:18px; background:var(--panel-2); border-radius:999px; overflow:hidden; position:relative; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--teal-dim),var(--teal)); border-radius:999px; }
  .progress-fill.done{ background:linear-gradient(90deg,var(--gold-dim),var(--gold)); }
  .broker-stat{ font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; width:64px; text-align:right; }
  .broker-remain{ font-size:12.5px; color:var(--text-dim); width:110px; text-align:right; }

  .agg-wrap{ flex:1; display:flex; align-items:center; justify-content:center; gap:80px; }
  .radial{ position:relative; width:340px; height:340px; }
  .radial svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .radial-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .radial-num{ font-family:'Oswald',sans-serif; font-weight:700; font-size:64px; line-height:1; }
  .radial-of{ font-size:15px; color:var(--text-dim); margin-top:4px; }
  .agg-side{ display:flex; flex-direction:column; gap:22px; max-width:380px; }
  .agg-stat{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 22px; }
  .agg-stat .label{ font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; }
  .agg-stat .value{ font-family:'Oswald',sans-serif; font-weight:700; font-size:30px; }
  .agg-stat .value.gold{ color:var(--gold); } .agg-stat .value.teal{ color:var(--teal); }

  .status-pill{ position:fixed; top:16px; right:16px; z-index:40; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:5px 12px; opacity:0.55; }
  .status-pill.err{ color:var(--danger); border-color:var(--danger); opacity:0.9; }

  .admin-toggle{ position:fixed; bottom:18px; right:18px; z-index:50; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--text-dim); font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0.3; transition:opacity 0.2s; }
  .admin-toggle:hover{ opacity:1; }
  .admin-overlay{ position:fixed; inset:0; background:rgba(6,10,11,0.9); z-index:100; display:none; overflow-y:auto; padding:40px; }
  .admin-overlay.open{ display:block; }
  .admin-box{ max-width:520px; margin:0 auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px 32px; }
  .admin-box h2{ font-family:'Oswald',sans-serif; margin-top:0; font-size:22px; }
  .admin-box p.hint{ font-size:12.5px; color:var(--text-dim); margin-top:-8px; margin-bottom:18px; }
  .field-row{ margin-bottom:14px; }
  .field-row label{ font-size:12px; color:var(--text-dim); display:block; margin-bottom:4px; }
  .field-row input{ width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:9px 11px; font-size:14px; font-family:'Inter',sans-serif; }
  button{ font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; border-radius:8px; border:none; padding:9px 16px; }
  .btn-primary{ background:var(--teal); color:#082420; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
  .btn-row{ display:flex; gap:10px; margin-top:20px; justify-content:flex-end; }
  .dots{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:40; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--line); }
  .dot.active{ background:var(--teal); }


  .field-row select{ width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:9px 11px; font-size:14px; font-family:'Inter',sans-serif; }
  .goal-header{ margin-bottom:8px; }
  .tier-badge{ font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; color:var(--bg); background:var(--teal); border-radius:999px; padding:5px 16px; margin-left:16px; vertical-align:middle; }
  .tier-badge.desafio{ background:var(--gold); }
  .goal-wrap{ flex:1; display:flex; align-items:center; justify-content:center; gap:80px; }
  .goal-prize{ display:flex; flex-direction:column; gap:16px; max-width:440px; }
  .prize-total{ font-size:19px; color:var(--text-dim); line-height:1.4; }
  .pix-lines{ display:flex; flex-direction:column; gap:6px; }
  .pix-line{ font-family:'Oswald',sans-serif; font-weight:700; font-size:30px; color:var(--teal); }
  .pix-line.gold{ color:var(--gold); }
  .bonus-line{ font-size:16.5px; color:var(--gold); font-weight:600; }
  .champion-note{ margin-top:6px; font-size:15px; color:var(--text-dim); }
  .rewards-banner{ display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; }
  .reward-pill{ display:flex; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 20px; font-size:15px; color:var(--text); }
  .reward-pill b{ color:var(--gold); }
</style>
</head>
<body>

<div class="display" id="display"></div>
<div class="dots" id="dots"></div>
<div class="status-pill" id="statusPill">carregando...</div>
<div class="admin-toggle" id="adminToggle">&#9881;</div>

<div id="ytPlayer" style="position:fixed; left:-10px; top:-10px; width:2px; height:2px; opacity:0; overflow:hidden; pointer-events:none;"></div>

<div class="admin-overlay" id="adminOverlay">
  <div class="admin-box">
    <h2>Configurações do ranking</h2>
    <p class="hint">As vendas vêm automaticamente da planilha. Aqui você só ajusta as metas e o nome da empresa (fica salvo neste navegador).</p>
    <div class="field-row"><label>Empresa</label><input id="cfgEmpresa"></div>
    <div class="field-row"><label>Meta individual mensal (vendas)</label><input id="cfgMetaIndividual" type="number"></div>
    <div class="field-row"><label>Meta 1 &middot; Equipe (vendas)</label><input id="cfgMeta1" type="number"></div>
    <div class="field-row"><label>Meta 2 &middot; Equipe (vendas)</label><input id="cfgMeta2" type="number"></div>
    <div class="field-row"><label>Meta 3 &middot; Equipe / Desafio (vendas)</label><input id="cfgMeta3" type="number"></div>
    <div class="field-row"><label>Meta anual da empresa (vendas)</label><input id="cfgMetaAnoEmpresa" type="number"></div>
    <div class="field-row"><label>Mínimo de vendas para a viagem (Desafio Holder)</label><input id="cfgMinViagem" type="number"></div>
    <div class="field-row"><label>Mês de início do Desafio Holder</label>
      <select id="cfgDesafioMes">
        <option value="JANEIRO">Janeiro</option><option value="FEVEREIRO">Fevereiro</option><option value="MARÇO">Março</option><option value="ABRIL">Abril</option><option value="MAIO">Maio</option><option value="JUNHO">Junho</option><option value="JULHO">Julho</option><option value="AGOSTO">Agosto</option><option value="SETEMBRO">Setembro</option><option value="OUTUBRO">Outubro</option><option value="NOVEMBRO">Novembro</option><option value="DEZEMBRO">Dezembro</option>
      </select>
    </div>
    <div class="field-row"><label>Ano do Desafio Holder</label><input id="cfgDesafioAno" type="number"></div>
    <div class="field-row"><label>Mês de referência (Meta Individual e Metas 1/2/3)</label>
      <select id="cfgMesReferencia">
        <option value="JANEIRO">Janeiro</option><option value="FEVEREIRO">Fevereiro</option><option value="MARÇO">Março</option><option value="ABRIL">Abril</option><option value="MAIO">Maio</option><option value="JUNHO">Junho</option><option value="JULHO">Julho</option><option value="AGOSTO">Agosto</option><option value="SETEMBRO">Setembro</option><option value="OUTUBRO">Outubro</option><option value="NOVEMBRO">Novembro</option><option value="DEZEMBRO">Dezembro</option>
      </select>
      <p class="hint" style="margin-top:6px;margin-bottom:0;">Normalmente é o mês atual — só muda aqui se quiser conferir um mês antes dele virar de verdade no calendário.</p>
    </div>
    <div class="field-row"><label>Link do YouTube pra tocar como música de fundo (deixe vazio pra não tocar)</label><input id="cfgYoutubeUrl" placeholder="https://www.youtube.com/watch?v=..."></div>
    <div class="field-row"><label>Volume da música de fundo (0-100)</label><input id="cfgMusicVolume" type="number" min="0" max="100"></div>
    <div class="btn-row">
      <button class="btn-ghost" id="closeAdminBtn">Fechar sem salvar</button>
      <button class="btn-primary" id="saveBtn">Salvar</button>
    </div>
  </div>
</div>

function money(v){ return "R$ " + Math.round(v||0).toLocaleString('pt-BR'); }
function initials(name){ return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function mesTitle(mesUpper){ const s = (mesUpper||"").toString(); return s.charAt(0) + s.slice(1).toLowerCase(); }
function moneyToNumber(s){
  if(s===null || s===undefined || s==="") return null;
  if(typeof s === "number") return s;
  const clean = String(s).replace("R$","").trim().replace(/\./g,"").replace(",",".");
  const n = parseFloat(clean);
  return isNaN(n) ? null : n;
}

// ---------------- Intercalar com vídeo do YouTube ----------------
function extractYouTubeId(input){
  if(!input) return null;
  const s = input.trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(s)) return s; // já é só o ID
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtube\.com\/live\/|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/
  ];
  for(const re of patterns){
    const m = s.match(re);
    if(m) return m[1];
  }
  return null;
}

let ytPlayer = null, ytReady = false;

function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player('ytPlayer', {
    width: '2', height: '2',

    }
  });
}
(function loadYouTubeApi(){

// Aplica o link/volume atuais da CONFIG ao player (chamado quando o player fica pronto e sempre que salva a engrenagem)
function applyMusicConfig(){
  if(!ytReady || !ytPlayer) return;
  const id = extractYouTubeId(CONFIG.youtubeUrl);
  const vol = Math.max(0, Math.min(100, CONFIG.musicVolume||40));
  try{
    if(!id){ ytPlayer.stopVideo(); return; }
    ytPlayer.setVolume(vol);
    ytPlayer.loadVideoById(id);
  }catch(e){ /* API pode não estar pronta ainda; onReady chama de novo */ }
}

// ---------------- Busca via JSONP (funciona mesmo abrindo o arquivo direto do computador) ----------------
function loadGvizJsonp(){
  return new Promise((resolve, reject)=>{
    const cbName = 'gvizCb_' + Date.now();
    const timeout = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 12000);
    function cleanup(){
      clearTimeout(timeout);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(resp){ cleanup(); resolve(resp); };
    const script = document.createElement('script');
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&headers=2&tqx=out:jsonp;responseHandler:${cbName}&_=${Date.now()}`;
    script.onerror = ()=>{ cleanup(); reject(new Error('script error')); };
    document.body.appendChild(script);
  });
}

// A partir de qual mês (deste ano de calendário) as vendas contam para o Desafio Holder / Corretor Campeão.
// Vendas de meses anteriores continuam contando normalmente em "Vendas do Ano" (controle pessoal), só não entram nesse ranking.
function processRows(rows){
  let lastMes = "";
  const perYear = {}, perMonth = {}, perDesafio = {};
  const mesAtualNome = (CONFIG.mesReferencia||"SETEMBRO").toUpperCase();
  const desafioStartIdx = Math.max(0, MESES.indexOf((CONFIG.desafioMes||"OUTUBRO").toUpperCase()));

  rows.forEach(r=>{
    const mesCell = (r[MES_COL_KEY]||"").toString().trim();
    if(mesCell) lastMes = mesCell.toUpperCase();
    const corretorRaw = (r["CORRETOR"]||"").toString().trim();
    if(!corretorRaw) return;
    if(EXCLUDE.includes(corretorRaw.toLowerCase())) return;
    const status = (r["Valor pago"]||"").toString().trim().toUpperCase();
    if(status === "DISTRATO") return;

    const nome = corretorRaw;
    const valor = moneyToNumber(r["VALOR DA UNIDADE"]);
    if(valor === null) return;

    if(!perYear[nome]) perYear[nome] = {count:0, vgv:0};
    perYear[nome].count += 1;
    perYear[nome].vgv += valor;

    if(lastMes === mesAtualNome){
      if(!perMonth[nome]) perMonth[nome] = {count:0, vgv:0};
      perMonth[nome].count += 1;
      perMonth[nome].vgv += valor;
    }

    const mesIdx = MESES.indexOf(lastMes);
    if(mesIdx >= desafioStartIdx){
      if(!perDesafio[nome]) perDesafio[nome] = {count:0, vgv:0};
      perDesafio[nome].count += 1;
      perDesafio[nome].vgv += valor;
    }
  });

  const anoArr = Object.keys(perYear).map(nome=>({
    nome, vendasAno: perYear[nome].count, vgvAno: perYear[nome].vgv,
    vendasMes: (perMonth[nome]||{count:0}).count, vgvMes: (perMonth[nome]||{vgv:0}).vgv
  }));
  const desafioArr = Object.keys(perDesafio).map(nome=>({
    nome, vendasDesafio: perDesafio[nome].count, vgvDesafio: perDesafio[nome].vgv
  }));

  RANKED_ANO = [...anoArr].sort((a,b)=> b.vendasAno - a.vendasAno || b.vgvAno - a.vgvAno);
  RANKED_MES = [...anoArr].sort((a,b)=> b.vendasMes - a.vendasMes || b.vgvMes - a.vgvMes);
  RANKED_DESAFIO = [...desafioArr].sort((a,b)=> b.vendasDesafio - a.vendasDesafio || b.vgvDesafio - a.vgvDesafio);
  TOTAL_ANO = anoArr.reduce((s,c)=>s+c.vendasAno,0);
  TOTAL_MES = anoArr.reduce((s,c)=>s+c.vendasMes,0);
  TOTAL_DESAFIO = desafioArr.reduce((s,c)=>s+c.vendasDesafio,0);
}

async function fetchAndProcess(){
  try{
    const resp = await loadGvizJsonp();
    const cols = resp.table.cols.map(c => (c.label||"").trim());
    // a coluna de mês pode vir com prefixo (ex: "VENDAS HOLDER 2026 MÊS") — acha a coluna certa pelo texto, não pelo nome exato
    MES_COL_KEY = cols.find(c => c.toUpperCase().includes("MÊS")) || cols.find(c => c.toUpperCase().includes("MES")) || "MÊS";
    const rows = resp.table.rows.map(r=>{
      const o = {};
      cols.forEach((label,i)=>{
        const cell = r.c[i];
        o[label] = cell ? (cell.v !== null && cell.v !== undefined ? cell.v : (cell.f||"")) : "";
      });
      return o;
    });
    processRows(rows);
    setStatus('atualizado ' + new Date().toLocaleTimeString('pt-BR'));
  }catch(e){
    setStatus('não consegui acessar a planilha agora', true);
  }
}

// ---------------- Podium reutilizável (Vendas do Ano / Desafio Holder) ----------------
function renderPodiumAndRest(list, countKey, vgvKey){
  const top3 = list.slice(0,3);
  const rest = list.slice(3);
  const order = [1,0,2];
  let podiumHtml = order.map(i=>{
    const c = top3[i];
    if(!c) return '';
    const cls = i===0?'p1':(i===1?'p2':'p3');
    const key = matchPhotoKey(c.nome);
    const size = i===0?132:104;
    const photoEl = key
      ? `<img class="podium-photo" src="data:image/jpeg;base64,${PHOTOS[key]}">`
      : `<div class="podium-photo broker-avatar-fallback" style="width:${size}px;height:${size}px;">${initials(c.nome)}</div>`;
    return `
      <div class="podium-slot ${cls}">
        <div class="podium-photo-wrap">${photoEl}<div class="rank-badge">${i+1}</div></div>
        <div class="podium-name">${c.nome}</div>
        <div class="podium-count">${c[countKey]}</div>
        <div class="podium-vgv">${money(c[vgvKey])}</div>
        <div class="podium-bar"></div>
      </div>`;
  }).join('');

  const restHtml = rest.map((c,idx)=>`
    <div class="rest-row">
      <div class="rest-rank">${idx+4}</div>
      <div class="rest-name">${c.nome}</div>
      <div class="rest-count">${c[countKey]} vendas</div>
      <div class="rest-vgv">${money(c[vgvKey])}</div>
    </div>`).join('');

  return { podiumHtml, restHtml, hasRest: rest.length>0, top1: top3[0] };
}

// ---------------- Slide 1: Vendas do Ano (controle pessoal, não decide o Desafio Holder) ----------------
function renderSlide1(){
  const { podiumHtml, restHtml, hasRest } = renderPodiumAndRest(RANKED_ANO, 'vendasAno', 'vgvAno');
  return `
    <div class="eyebrow">${CONFIG.empresa} &middot; Controle pessoal</div>
    <h1 class="slide-title">Vendas do Ano</h1>
    <div class="slide-sub">Histórico completo de ${CONFIG.desafioAno} &middot; não vale para o Desafio Holder</div>
    <div class="podium-wrap">${podiumHtml}</div>
    ${hasRest ? `<div class="rest-list">${restHtml}</div>` : ''}
  `;
}

// ---------------- Slide 2: Desafio Holder · Corretor Campeão (só conta a partir do mês configurado) ----------------
function renderSlideDesafioCampeao(){
  const { podiumHtml, restHtml, hasRest, top1 } = renderPodiumAndRest(RANKED_DESAFIO, 'vendasDesafio', 'vgvDesafio');
  const min = CONFIG.minVendasViagem;
  const faltamViagem = top1 ? Math.max(0, min - top1.vendasDesafio) : min;
  const mesRaw = (CONFIG.desafioMes||"OUTUBRO");
  const mesLabel = mesTitle(mesRaw);
  return `
    <div class="eyebrow">${CONFIG.empresa} &middot; Desafio Holder</div>
    <h1 class="slide-title">Corretor Campeão</h1>
    <div class="slide-sub">Vendas contam a partir de ${mesLabel}/${CONFIG.desafioAno} &middot; desempate por VGV vendido</div>
    <div class="podium-wrap">${podiumHtml}</div>
    ${hasRest ? `<div class="rest-list">${restHtml}</div>` : ''}
    <div class="champion-note">1º lugar: viagem com 1 acompanhante (2 diárias, litoral de SP) + troféu — mínimo ${min} vendas no desafio${faltamViagem>0 ? ` (faltam ${faltamViagem})` : ' — meta batida!'}. 2º e 3º lugar: troféu + brinde.</div>
  `;
}

// ---------------- Slide 3: Meta Individual Mensal ----------------
function renderSlideIndividualMensal(){
  const meta = CONFIG.metaIndividualMensal;
  const rows = RANKED_MES.map(c=>{
    const pct = Math.min(100, (c.vendasMes/meta)*100);
    const done = c.vendasMes >= meta;
    const key = matchPhotoKey(c.nome);
    const photoEl = key
      ? `<img class="broker-photo" src="data:image/jpeg;base64,${PHOTOS[key]}">`
      : `<div class="broker-avatar-fallback">${initials(c.nome)}</div>`;
    const faltam = Math.max(0, meta - c.vendasMes);
    return `
      <div class="broker-row">
        ${photoEl}
        <div class="broker-name">${c.nome}</div>
        <div class="progress-track"><div class="progress-fill ${done?'done':''}" style="width:${pct}%;"></div></div>
        <div class="broker-stat">${c.vendasMes}/${meta}</div>
        <div class="broker-remain">${done ? 'meta batida' : 'faltam ' + faltam}</div>
      </div>`;
  }).join('');
  return `
    <div class="meta-header">
      <div><div class="eyebrow">${CONFIG.empresa} &middot; ${mesTitle(CONFIG.mesReferencia)}</div><h1 class="slide-title">Meta Individual Mensal</h1></div>
      <div class="meta-badge">Meta: ${meta} vendas/mês</div>
    </div>
    <div class="broker-rows">${rows}</div>
    <div class="rewards-banner">
      <div class="reward-pill">Camiseta personalizada Holder</div>
      <div class="reward-pill">Troféu de campeão do mês</div>
      <div class="reward-pill">Incentivo de <b>${money(2000)}</b> em leads</div>
      <div class="reward-pill">Almoço ou jantar do campeão</div>
    </div>
  `;
}

// ---------------- Slides 4-6: Meta Equipe 1 / 2 / 3 (desafio) ----------------
function radialSvg(pct, color){
  const r = 150, c = 2*Math.PI*r;
  const off = c - (Math.min(100,pct)/100)*c;
  return `<svg viewBox="0 0 340 340">
      <circle cx="170" cy="170" r="${r}" fill="none" stroke="var(--panel-2)" stroke-width="22"/>
      <circle cx="170" cy="170" r="${r}" fill="none" stroke="${color}" stroke-width="22" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg>`;
}

function renderMetaEquipeTier(numero, meta, premioTotal, pixLines, bonusText, isDesafio){
  const pct = Math.min(100, (TOTAL_MES/meta)*100);
  const faltam = Math.max(0, meta - TOTAL_MES);
  const color = isDesafio ? 'var(--gold)' : 'var(--teal)';
  const pixHtml = pixLines.map(l=>`<div class="pix-line ${isDesafio?'gold':''}">${l}</div>`).join('');
  return `
    <div class="goal-header">
      <div class="eyebrow">${CONFIG.empresa} &middot; Meta Equipe Mensal</div>
      <h1 class="slide-title">Meta ${numero}${isDesafio ? '<span class="tier-badge desafio">DESAFIO</span>' : ''}</h1>
    </div>
    <div class="goal-wrap">
      <div class="radial">${radialSvg(pct,color)}<div class="radial-center"><div class="radial-num">${TOTAL_MES}</div><div class="radial-of">de ${meta} vendas</div></div></div>
      <div class="goal-prize">
        <div class="prize-total">${money(premioTotal)} diluídos em sorteio entre quem vender.</div>
        <div class="pix-lines">${pixHtml}</div>
        ${bonusText ? `<div class="bonus-line">${bonusText}</div>` : ''}
        <div class="champion-note">${faltam===0 ? 'Meta batida — sorteio garantido!' : `Faltam ${faltam} vendas da equipe para bater essa meta`}</div>
      </div>
    </div>
  `;
}
function renderSlideMeta1(){
  return renderMetaEquipeTier(1, CONFIG.metaEquipe1, 5000, ["2 PIX de R$ 1.000","6 PIX de R$ 500"], "", false);
}
function renderSlideMeta2(){
  return renderMetaEquipeTier(2, CONFIG.metaEquipe2, 8000, ["3 PIX de R$ 1.000","10 PIX de R$ 500"], "", false);
}
function renderSlideMeta3(){
  return renderMetaEquipeTier(3, CONFIG.metaEquipe3, 10000, ["5 PIX de R$ 1.000","10 PIX de R$ 500"], "+ Bônus: evento de comemoração (churrasco ou almoço)", true);
}

// ---------------- Slide 7: Meta Anual da Empresa (sorteio iPhone 17) ----------------
function renderSlideAnualEmpresa(){
  const metaAno = CONFIG.metaAnualEmpresa;
  const pct = (TOTAL_DESAFIO/metaAno)*100;
  const faltamAno = Math.max(0, metaAno-TOTAL_DESAFIO);
  const now = new Date();
  const mesesRestantes = Math.max(1, 12 - now.getMonth());
  const ritmoNecessario = Math.ceil(faltamAno / mesesRestantes);
  const mesRaw = (CONFIG.desafioMes||"OUTUBRO");
  const mesLabel = mesTitle(mesRaw);
  return `
    <div class="eyebrow">${CONFIG.empresa} &middot; Meta Anual</div>
    <h1 class="slide-title">Meta Anual da Empresa</h1>
    <div class="slide-sub">Sorteio de um iPhone 17 entre quem bater a meta &middot; vendas contam a partir de ${mesLabel}/${CONFIG.desafioAno}</div>
    <div class="agg-wrap">
      <div class="radial">${radialSvg(pct,'var(--gold)')}<div class="radial-center"><div class="radial-num">${TOTAL_DESAFIO}</div><div class="radial-of">de ${metaAno} vendas</div></div></div>
      <div class="agg-side">
        <div class="agg-stat"><div class="label">Faltam para a meta</div><div class="value ${faltamAno===0?'gold':'teal'}">${faltamAno===0?'Meta batida!':faltamAno+' vendas'}</div></div>
        <div class="agg-stat"><div class="label">Ritmo necessário / mês (${mesesRestantes} meses restantes)</div><div class="value teal">${ritmoNecessario} vendas/mês</div></div>
      </div>
    </div>`;
}

function renderAll(){
  const slides = [
    renderSlide1(),
    renderSlideDesafioCampeao(),
    renderSlideIndividualMensal(),
    renderSlideMeta1(),
    renderSlideMeta2(),
    renderSlideMeta3(),
    renderSlideAnualEmpresa()
  ];
  const display = document.getElementById('display');
  display.innerHTML = slides.map((html,i)=>`<div class="slide ${i===currentSlide?'active':''}" data-i="${i}">${html}</div>`).join('');
  const dots = document.getElementById('dots');
  dots.innerHTML = slides.map((_,i)=>`<div class="dot ${i===currentSlide?'active':''}"></div>`).join('');
}
function nextSlide(){
  currentSlide = (currentSlide+1) % SLIDE_COUNT;
  document.querySelectorAll('.slide').forEach(s=> s.classList.toggle('active', +s.dataset.i === currentSlide));
  document.querySelectorAll('.dot').forEach((d,i)=> d.classList.toggle('active', i===currentSlide));
}
setInterval(nextSlide, ROTATE_MS);

function openAdmin(){
  document.getElementById('cfgEmpresa').value = CONFIG.empresa;
  document.getElementById('cfgMetaIndividual').value = CONFIG.metaIndividualMensal;
  document.getElementById('cfgMeta1').value = CONFIG.metaEquipe1;
  document.getElementById('cfgMeta2').value = CONFIG.metaEquipe2;
  document.getElementById('cfgMeta3').value = CONFIG.metaEquipe3;
  document.getElementById('cfgMetaAnoEmpresa').value = CONFIG.metaAnualEmpresa;
  document.getElementById('cfgMinViagem').value = CONFIG.minVendasViagem;
  document.getElementById('cfgDesafioMes').value = CONFIG.desafioMes || 'OUTUBRO';
  document.getElementById('cfgDesafioAno').value = CONFIG.desafioAno;
  document.getElementById('cfgMesReferencia').value = CONFIG.mesReferencia || MESES[new Date().getMonth()];
  document.getElementById('cfgYoutubeUrl').value = CONFIG.youtubeUrl || '';
  document.getElementById('cfgMusicVolume').value = CONFIG.musicVolume||40;
  document.getElementById('adminOverlay').classList.add('open');
}
document.getElementById('adminToggle').onclick = openAdmin;
document.getElementById('closeAdminBtn').onclick = ()=> document.getElementById('adminOverlay').classList.remove('open');
document.getElementById('saveBtn').onclick = async ()=>{
  CONFIG.empresa = document.getElementById('cfgEmpresa').value || 'Empresa';
  CONFIG.metaIndividualMensal = parseInt(document.getElementById('cfgMetaIndividual').value)||1;
  CONFIG.metaEquipe1 = parseInt(document.getElementById('cfgMeta1').value)||1;
  CONFIG.metaEquipe2 = parseInt(document.getElementById('cfgMeta2').value)||1;
  CONFIG.metaEquipe3 = parseInt(document.getElementById('cfgMeta3').value)||1;
  CONFIG.metaAnualEmpresa = parseInt(document.getElementById('cfgMetaAnoEmpresa').value)||1;
  CONFIG.minVendasViagem = parseInt(document.getElementById('cfgMinViagem').value)||1;
  CONFIG.desafioMes = document.getElementById('cfgDesafioMes').value || 'OUTUBRO';
  CONFIG.desafioAno = parseInt(document.getElementById('cfgDesafioAno').value)||new Date().getFullYear();
  CONFIG.mesReferencia = document.getElementById('cfgMesReferencia').value || MESES[new Date().getMonth()];
  CONFIG.youtubeUrl = document.getElementById('cfgYoutubeUrl').value.trim();
  CONFIG.musicVolume = Math.max(0, Math.min(100, parseInt(document.getElementById('cfgMusicVolume').value)||40));
  saveConfig();
  document.getElementById('adminOverlay').classList.remove('open');
  await refresh(); // reprocessa a planilha com o novo mês de referência / início do desafio
  applyMusicConfig();
};

async function refresh(){ await fetchAndProcess(); renderAll(); }

(async function(){
  loadConfig();
  await refresh();
  setInterval(refresh, 60000);
})();
</script>
